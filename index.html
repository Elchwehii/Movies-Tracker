async function fetchNoVpn(targetUrl, headers){
 const proxies = [
  () => fetch(targetUrl, {headers, signal: AbortSignal.timeout ? AbortSignal.timeout(4500) : undefined}),
  () => fetch("https://corsproxy.io/?" + encodeURIComponent(targetUrl), {headers}),
  () => fetch("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(targetUrl), {headers})
 ];
 let lastErr;
 for (const fn of proxies) {
  try {
   const r = await fn();
   if (r.ok) return r;
   lastErr = new Error("HTTP " + r.status);
  } catch (e) {
   lastErr = e;
  }
 }
 throw lastErr || new Error("Network failed");
}

const norm=s=>String(s).toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z0-9]/g,"");
function mergeMarvel(base,mv,tv,t0){const out=base.map(i=>({...i})),has=(t,n)=>out.find(i=>i.u=="M"&&i.t==t&&norm(i.n)==norm(n));
 for(const r of mv){const d=r.release_date;if(!d)continue;const m=has("F",r.title);
  if(m){if(d>=t0&&m.d!=d&&(m.d.length<10||m.d>=t0)){m.d=d;m.k=d;m.upd=1}}
  else if(d>=t0)out.push({d,k:d,t:"F",u:"M",p:0,n:r.title,id:"M"+d+r.title,live:1})}
 for(const r of tv){const d=r.first_air_date;if(d&&d>=t0&&!has("S",r.name))out.push({d,k:d,t:"S",u:"M",p:0,n:r.name,id:"M"+d+r.name,live:1})}
 return out.sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:0)}
/*ENDMERGE*/
async function refresh(){AL={};if(!KEY())return;prune();
 try{const q=(p,e)=>tm(p,{with_companies:"420",without_genres:"99",...e});
  const[mv,tv]=await Promise.all([q("/discover/movie",{sort_by:"primary_release_date.asc","primary_release_date.gte":off(-30)}),q("/discover/tv",{sort_by:"first_air_date.asc","first_air_date.gte":off(-30)})]);
  items=mergeMarvel(BASE,mv.results,tv.results,todayS())}catch(e){}}
const cv=(r,t)=>({id:t+r.id,n:r.title||r.name||"",d:r.release_date||r.first_air_date||"",t,a:(r.genre_ids||[]).includes(16)&&r.original_language=="ja"?1:0,img:r.poster_path,ov:r.overview||""});
async function loadUp(){const m=(p,e)=>tm(p,{sort_by:"popularity.desc",include_adult:"false",...e}),mv={"primary_release_date.gte":off(0),"primary_release_date.lte":off(540)},tq={"first_air_date.gte":off(0),"first_air_date.lte":off(540)},ja={with_genres:"16",with_original_language:"ja"};
 const R=await Promise.all([m("/discover/movie",{...mv,page:1}),m("/discover/movie",{...mv,page:2}),m("/discover/tv",{...tq,page:1}),m("/discover/tv",{...tq,page:2}),m("/discover/tv",{...tq,...ja}),m("/discover/movie",{...mv,...ja})]),map=new Map();
 [[0,"F",0],[1,"F",0],[2,"S",0],[3,"S",0],[4,"S",1],[5,"F",1]].forEach(([k,t,a])=>R[k].results.forEach(r=>{const o=cv(r,t);if(o.d&&(a||!map.has(o.id))){if(a)o.a=1;map.set(o.id,o)}}));
 return[...map.values()].sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0)}
async function loadTrend(){const[a,b,c]=await Promise.all([tm("/trending/all/day"),tm("/discover/movie",{sort_by:"popularity.desc","primary_release_date.gte":off(-21),"primary_release_date.lte":off(0)}),tm("/discover/tv",{sort_by:"popularity.desc","first_air_date.gte":off(-21),"first_air_date.lte":off(0)})]);
 AL.trend=a.results.filter(r=>r.media_type!="person").slice(0,15).map(r=>cv(r,r.media_type=="movie"?"F":"S"));
 AL.fresh=[...b.results.slice(0,10).map(r=>cv(r,"F")),...c.results.slice(0,10).map(r=>cv(r,"S"))].sort((x,y)=>x.d<y.d?1:-1)}
/* ---- views ---- */
function heroOf(nx,sub){return`<section class="hero"><small>NEXT RELEASE</small><h1>${esc(nx.n)}</h1><p>${fmt(nx,{weekday:"long",year:"numeric",month:"long",day:"numeric"})} · ${sub}</p><div class="cd" id="cd" data-t="${tg(nx).getTime()}"></div><a class="btn" href="${gcal(nx)}" target="_blank" rel="noopener">📅 Add to calendar</a></section>`}
function hero(){const nx=items.find(i=>isUp(i)&&i.u=="M"&&i.d.length==10)||items.find(isUp);return nx?heroOf(nx,UN[nx.u]+(nx.p?" · Phase "+nx.p:"")):""}
function arow(i){REG[i.id]=i;const L=LST[i.id]||{},r=i.d&&i.d.length==10?rel(i):{up:0,t:"Date TBA"};
 return`<div class="row">${i.img?`<img class="th" loading="lazy" alt="" src="https://image.tmdb.org/t/p/w92${i.img}" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://wsrv.nl/?url=image.tmdb.org/t/p/w92${i.img}'}">`:'<div class="th"></div>'}<div class="mid"><h4>${esc(i.n)}</h4><i class="tag">${i.a?"Anime":i.t=="F"?"Movie":"Series"}</i>${i.d?`<i class="tag">${i.d}</i>`:""}<p class="ov">${esc(i.ov)}</p></div><div class="rt"><span class="rel${r.up?" up":""}">${r.t}</span>${r.up&&i.d.length==10?`<a href="${gcal(i)}" target="_blank" rel="noopener" title="Add to calendar">📅</a>`:""}<button class="chk${L.w?" on":""}" data-a="w:${i.id}" title="Watchlist">★</button><button class="chk${L.s?" on":""}" data-a="s:${i.id}" title="Watched">✓</button></div></div>`}
const note=()=>KEY()?`<p class="dim" style="margin-bottom:10px">Live data refreshed ${S("mt:net")?agoT(S("mt:net")):"–"}. It updates itself whenever you open the app.</p>`:`<div class="note">Want this list to update itself every day? Add a free TMDB key in ⚙ settings (one time).</div>`;
function marvelView(v){const up=items.filter(isUp),rl=items.filter(i=>!isUp(i)).reverse();
 if(v=="m-up")return`<h3>Every upcoming Marvel title</h3><p class="dim" style="margin-bottom:10px">Dates can change. Tap 📅 to add a release to your calendar.</p>${up.map(row).join("")}`;
 if(v=="m-lib")return`<div class="filters"><input class="in" id="q" placeholder="Search titles" value="${esc(F.q)}">${chip("t","","All")}${chip("t","F","Movies")}${chip("t","S","Series")}</div><div class="filters">${chip("u","","All universes")}${Object.keys(UN).map(k=>chip("u",k,UN[k])).join("")}</div>${!F.u||F.u=="M"?`<div class="filters">${chip("p","","All phases")}${[1,2,3,4,5,6].map(n=>chip("p",""+n,"Phase "+n)).join("")}</div>`:""}<div id="list"></div>`;
 return note()+hero()+`<h3>Coming up</h3>${up.slice(0,6).map(row).join("")}${stats()}<h3>Recently released</h3>${rl.filter(i=>i.u=="M").slice(0,5).map(row).join("")}`}
const setup=()=>`<section class="setup"><h3>Daily live updates (free, one time)</h3><ol><li>Make a free account at <a href="https://www.themoviedb.org/signup" target="_blank" rel="noopener">themoviedb.org</a>.</li><li>Open <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">Settings → API</a>, request a key (choose Developer, personal use) and copy the <b>API Read Access Token</b>.</li><li>Paste it here. It stays on this device only.</li></ol><div class="filters"><input class="in" id="key" placeholder="Paste your TMDB token or key" value="${esc(KEY())}"><button class="chip on" id="savekey">Save &amp; connect</button></div><p class="dim" id="keymsg"></p></section>`;
const setView=()=>setup()+`<section class="setup"><h3>Theme</h3><div class="dots" id="dots">${TH.map(([n,c])=>`<button data-th="${n}" title="${n}" style="background:${c}"></button>`).join("")}</div></section><section class="setup"><h3>Data</h3><div class="filters"><button class="chip" id="refnow">Refresh now</button><button class="chip" id="rmkey">Remove key</button><button class="chip" id="rmdata">Reset my lists</button></div><p class="dim" style="margin-top:8px;font-size:12px">This product uses the TMDB API but is not endorsed or certified by TMDB. Marvel titles also come from a built-in list, so that section works without a key.</p></section>`;
function aUp(){const t=todayS(),a=AL.up.filter(i=>(!F.at||(F.at=="A"?i.a:F.at=="F"?i.t=="F"&&!i.a:i.t=="S"&&!i.a))&&i.d>=t),nx=a.find(i=>i.d>t);
 return`<div class="filters">${chip("at","","All")}${chip("at","F","Movies")}${chip("at","S","Series")}${chip("at","A","Anime")}</div>`+(nx?heroOf(nx,nx.a?"Anime":nx.t=="F"?"Movie":"Series"):"")+`<h3>Most anticipated, in date order</h3>`+(a.map(arow).join("")||'<div class="empty">Nothing found.</div>')}
const aList=()=>{const v=Object.values(LST),w=v.filter(x=>x.w&&!x.s).sort((a,b)=>a.d<b.d?-1:1),s=v.filter(x=>x.s);return`<h3>Watchlist</h3>${w.map(arow).join("")||'<p class="dim">Tap ★ on any title to save it here.</p>'}<h3>Watched</h3>${s.map(arow).join("")||'<p class="dim">Nothing marked watched yet.</p>'}`};
async function allView(v){if(v=="a-list")return aList();if(!KEY())return setup();
 try{if(v=="a-up"){AL.up=AL.up||await loadUp();return aUp()}
  if(v=="a-new"){if(!AL.trend)await loadTrend();return`<h3>Trending today</h3>${AL.trend.map(arow).join("")}<h3>Just released (last 3 weeks)</h3>${AL.fresh.map(arow).join("")}`}
  return`<div class="filters"><input class="in" id="fq" placeholder="Search any movie, series or anime"></div><div id="fr"></div>`}
 catch(e){return`<div class="empty">Couldn’t load live data (${esc(e.message)}). Check your connection, or your key in ⚙ settings.</div>`}}
async function render(){const tok=++RT,v=location.hash.slice(1)||"m-home";if(v!="set")LS=v[0]=="a"?"a":"m";
 $("#nav").innerHTML=NAV[LS].map(([id,ic,l])=>`<a href="#${id}" class="${id==v?"on":""}"><b>${ic}</b>${l}</a>`).join("");
 document.querySelectorAll(".pills button").forEach(b=>b.classList.toggle("on",v!="set"&&b.dataset.sec==LS));
 let h;if(v=="set"){h=setView()}else if(LS=="m"){h=marvelView(v)}else{if(KEY()&&!AL.up&&v=="a-up")$("#v").innerHTML='<div class="empty">Loading…</div>';h=await allView(v)}
 if(tok!=RT)return;$("#v").innerHTML=h;if(v=="m-lib")list();if(v=="set")theme(document.documentElement.dataset.t);tick()}
/* ---- actions ---- */
async function saveKey(){const k=$("#key").value.trim(),m=$("#keymsg");if(!k)return;S("mt:key",k);m.textContent="Testing…";tm.force=true;
 try{await tm("/configuration");tm.force=false;m.textContent="Connected ✓";await refresh();location.hash="#a-up";render()}catch(e){tm.force=false;S("mt:key","");m.textContent="That key didn’t work ("+e.message+"). Check you copied the whole token."}}
$("#v").addEventListener("click",async e=>{const T=s=>e.target.closest(s),w=T("[data-w]"),f=T("[data-f]"),a=T("[data-a]");
 if(w){const id=items[+w.dataset.w].id;W.has(id)?W.delete(id):W.add(id);S("mt:w",[...W]);render()}
 if(f){const[k,v]=f.dataset.f.split(":");F[k]=v;if(k=="u"&&v&&v!="M")F.p="";render()}
 if(a){const[m,id]=a.dataset.a.split(":"),o=REG[a.dataset.a.slice(2)];if(!o)return;const L=LST[o.id]||(LST[o.id]={id:o.id,n:o.n,d:o.d,t:o.t,a:o.a,img:o.img,ov:o.ov});L[m]=L[m]?0:1;if(!L.w&&!L.s)delete LST[o.id];S("mt:list",LST);render()}
 if(T("#savekey"))saveKey();
 if(T("#refnow")){tm.force=true;await refresh();tm.force=false;render()}
 if(T("#rmkey")){S("mt:key","");items=BASE.slice();AL={};render()}
 if(T("#rmdata")&&confirm("Clear your watched marks and lists on this device?")){W=new Set();LST={};S("mt:w",[]);S("mt:list",{});render()}});
$("#v").addEventListener("input",e=>{if(e.target.id=="q"){F.q=e.target.value;list()}
 if(e.target.id=="fq"){clearTimeout(FT);FT=setTimeout(async()=>{const q=e.target.value.trim(),o=$("#fr");if(q.length<2){o.innerHTML="";return}
  try{const r=await tm("/search/multi",{query:q,include_adult:"false"});o.innerHTML=r.results.filter(x=>x.media_type!="person").map(x=>arow(cv(x,x.media_type=="movie"?"F":"S"))).join("")||'<div class="empty">Nothing found.</div>'}catch(er){o.innerHTML='<div class="empty">Search failed. Check your connection.</div>'}},400)}});
const TH=[["midnight","#ff3b4e"],["infinity","#f5b942"],["emerald","#2ee6a6"],["crimson","#ff9f43"],["daylight","#e8e9f4"]];
function theme(t){document.documentElement.dataset.t=t;S("mt:t",t);document.querySelectorAll("[data-th]").forEach(b=>b.classList.toggle("on",b.dataset.th==t));
 document.querySelector("meta[name=theme-color]").content=t=="daylight"?"#f3f4fb":(getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()||"#0a0b14")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-th]");if(b)theme(b.dataset.th)});
document.querySelector(".pills").onclick=e=>{const b=e.target.closest("[data-sec]");if(b)location.hash=b.dataset.sec=="m"?"#m-home":"#a-up"};
$("#gear").onclick=()=>location.hash="#set";
theme(S("mt:t")||(matchMedia("(prefers-color-scheme: light)").matches?"daylight":"midnight"));
addEventListener("hashchange",render);setInterval(tick,1000);
const go=()=>refresh().then(()=>{if(!$("#q")&&!$("#fq")&&!$("#key"))render()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)go()});
setInterval(()=>{if(!document.hidden&&!$("#q")&&!$("#fq")&&!$("#key"))render()},60000);
render();go();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
